name: Build Nosra Farm APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'nosra_farm_android_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q nosra_farm_android_project.zip -d appsrc

      - name: Build APK
        working-directory: appsrc/nosra_farm_android
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp appsrc/nosra_farm_android/app/build/outputs/apk/debug/app-debug.apk output/NosraFarm-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NosraFarm-APK
          path: output/NosraFarm-debug.apk
