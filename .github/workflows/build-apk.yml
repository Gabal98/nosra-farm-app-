name: Build Nosra Farm APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'nosra_farm_android_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q nosra_farm_android_project.zip -d appsrc

      - name: Find Gradle wrapper
        id: locate
        run: |
          WRAPPER=$(find appsrc -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found"
            exit 1
          fi
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project_dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.locate.outputs.wrapper }}"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleDebug

      - name: Collect APK
        run: |
          APK=$(find "${{ steps.locate.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/NosraFarm-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NosraFarm-APK
          path: output/NosraFarm-debug.apk
